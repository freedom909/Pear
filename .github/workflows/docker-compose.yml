name: Docker Compose Integration Test

on:
  push:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/docker-compose.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/docker-compose.yml'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Start services with Docker Compose
        run: |
          docker-compose up -d
      
      - name: Wait for services to be ready
        run: |
          # Wait for backend to be ready
          timeout 60s bash -c 'until curl -s http://localhost:3001/api/health | grep -q "ok"; do sleep 2; done'
          
          # Wait for frontend to be ready
          timeout 60s bash -c 'until curl -s http://localhost:3000 | grep -q "<html"; do sleep 2; done'
      
      - name: Run integration tests
        run: |
          # Here you would run your integration tests
          # For example:
          # docker-compose exec -T backend npm run test:integration
          
          # For now, just check if services are responding
          curl -s http://localhost:3001/api/health
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000
      
      - name: Stop services
        run: |
          docker-compose down